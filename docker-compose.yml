# Cybernet Stock Tracker — app + Postgres.
#
# v0.1 is local/LAN only: nothing here exposes the app to the internet. The DB
# port is not published. In v1 a Caddy reverse proxy (TLS) and Cloudflare Tunnel
# are added in front of the app — see the README.
#
# Variable substitution below reads from a local .env (copy from .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocktracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocktracker}
      POSTGRES_DB: ${POSTGRES_DB:-stocktracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocktracker} -d ${POSTGRES_DB:-stocktracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Kept internal. Uncomment only to inspect the DB from the host.
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stocktracker}:${POSTGRES_PASSWORD:-stocktracker}@db:5432/${POSTGRES_DB:-stocktracker}?schema=public
      NODE_ENV: production
      AUTH_STUB_ENABLED: "true"
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: "15"
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"

volumes:
  db-data:
  uploads:
